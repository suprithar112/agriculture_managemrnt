<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crop Recommendation | Smart Agro AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .form-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
            gap:14px;
        }

        .result-box{
            display:none;
            font-size:20px;
        }

        .error-box{
            display:none;
            margin-top:20px;
            padding:18px;
            background:#ffebee;
            color:#b71c1c;
            border-radius:10px;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>Smart Agro AI</h2>
    <a href="/seller_dashboard">Seller Dashboard</a>
    <a href="/buyer_dashboard">Buyer Dashboard</a>
    <a href="/market">Marketplace</a>
    <a href="/disease_predictor">Disease Predictor</a>
    <a href="/voice_assistant">Voice Assistant</a>
    <a href="/logout">Logout</a>
</div>

<div class="main">
    <div class="topbar">
        <h2>AI Crop Recommendation</h2>
    </div>

    <div class="card">
        <form id="cropForm">
            <div class="form-grid">
                <select name="season" required>
                    <option value="">Select Season</option>
                    <option value="kharif">Kharif</option>
                    <option value="rabi">Rabi</option>
                    <option value="zaid">Zaid</option>
                    <option value="summer">Summer</option>
                    <option value="winter">Winter</option>
                    <option value="monsoon">Monsoon</option>
                </select>

                <input type="number" name="N" placeholder="Nitrogen (N)" value="50" required>
                <input type="number" name="P" placeholder="Phosphorus (P)" value="40" required>
                <input type="number" name="K" placeholder="Potassium (K)" value="40" required>
                <input type="number" step="0.1" name="temperature" placeholder="Temperature" required>
                <input type="number" step="0.1" name="humidity" placeholder="Humidity" required>
                <input type="number" step="0.1" name="ph" placeholder="Soil pH" required>
                <input type="number" step="0.1" name="rainfall" placeholder="Rainfall" required>
            </div>

            <button type="submit">Recommend Crop</button>
        </form>

        <div id="result" class="result-box"></div>
        <div id="error" class="error-box"></div>
    </div>
</div>

<script>
document.getElementById("cropForm").addEventListener("submit", async function(event){
    event.preventDefault();

    const resultBox = document.getElementById("result");
    const errorBox = document.getElementById("error");
    resultBox.style.display = "none";
    errorBox.style.display = "none";

    const formData = new FormData(event.target);
    const payload = Object.fromEntries(formData.entries());

    const response = await fetch("/predict_crop", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    const data = await response.json();

    if (data.success) {
        resultBox.textContent = "Recommended crop: " + data.recommended_crop;
        resultBox.style.display = "block";
    } else {
        errorBox.textContent = data.error || "Unable to recommend crop.";
        errorBox.style.display = "block";
    }
});
</script>

</body>
</html>
